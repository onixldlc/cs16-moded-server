name: Image (server)

# Build strategy mirrors onixldlc/elkstack (buildx + ghcr + metadata-action + gha cache).
# Versioning mirrors onixldlc/ReHLDS, ReGameDLL_CS and Metamod-R (tag -> ref name,
# otherwise git describe), so all four repos read the same way.
#
# Only a pushed tag v* publishes. Nothing is compiled here: the image layers the pinned
# mod releases onto ghcr.io/onixldlc/cs16-server, so a build is a download and a copy. Mod versions are the ARGs in docker/server/Dockerfile; workflow_dispatch can override
# them for a one-off build without editing the file.
#
# The post-push check runs on tag builds too, not only on non-publishing ones -- with
# branch builds off, a check gated on "not publishing" would never run and a broken
# image would ship.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      metamod_tag:
        description: 'Metamod-R release tag (blank = Dockerfile default)'
        required: false
        default: ''
      pugmod_tag:
        description: 'PugMod release tag (blank = Dockerfile default)'
        required: false
        default: ''
      hitboxfixer_tag:
        description: 'hitbox_fixer release tag (blank = Dockerfile default)'
        required: false
        default: ''
      yapb_tag:
        description: 'YaPB release tag (blank = Dockerfile default)'
        required: false
        default: ''
      reunion_tag:
        description: 'Reunion release tag (blank = Dockerfile default)'
        required: false
        default: ''
      zbot_assets_ref:
        description: 'ReGameDLL_CS ref for the zBot data files (blank = Dockerfile default)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: cs16-moded-server

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
            PUBLISH=false
          fi
          # Keep the string usable as a docker tag.
          VERSION="$(printf %s "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (publish=${PUBLISH})"

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve mod versions
        id: mods
        run: |
          # Empty input means "leave the Dockerfile ARG default alone", so only
          # non-empty overrides are emitted as build-args.
          {
            [[ -n "${{ github.event.inputs.metamod_tag }}" ]] && \
              echo "METAMOD_TAG=${{ github.event.inputs.metamod_tag }}"
            [[ -n "${{ github.event.inputs.pugmod_tag }}" ]] && \
              echo "PUGMOD_TAG=${{ github.event.inputs.pugmod_tag }}"
            [[ -n "${{ github.event.inputs.hitboxfixer_tag }}" ]] && \
              echo "HITBOXFIXER_TAG=${{ github.event.inputs.hitboxfixer_tag }}"
            [[ -n "${{ github.event.inputs.yapb_tag }}" ]] && \
              echo "YAPB_TAG=${{ github.event.inputs.yapb_tag }}"
            [[ -n "${{ github.event.inputs.reunion_tag }}" ]] && \
              echo "REUNION_TAG=${{ github.event.inputs.reunion_tag }}"
            [[ -n "${{ github.event.inputs.zbot_assets_ref }}" ]] && \
              echo "ZBOT_ASSETS_REF=${{ github.event.inputs.zbot_assets_ref }}"
            true
          } > /tmp/build-args
          echo "args<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/build-args >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/build-args

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/server/Dockerfile
          push: ${{ needs.determine-version.outputs.publish == 'true' }}
          load: ${{ needs.determine-version.outputs.publish != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.mods.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:latest"
          if [[ "${{ needs.determine-version.outputs.publish }}" == "true" ]]; then
            # The build pushed rather than loaded, so fetch what was published: the
            # release is then blocked by a failing check instead of shipping broken.
            IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ needs.determine-version.outputs.version }}"
            docker pull "$IMAGE"
          fi
          docker run --rm "$IMAGE" verify

      - name: Summary
        run: |
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published:** \`${{ needs.determine-version.outputs.publish }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ needs.determine-version.outputs.version }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo '**Mod versions:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker run --rm --entrypoint cat \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ needs.determine-version.outputs.publish == 'true' && needs.determine-version.outputs.version || 'latest' }}" \
            /opt/mods/.mods-version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
