name: Image (fastdl)

# The download mirror, built from docker/fastdl. Split out from the server image because the
# two have nothing in common: this one has no mod versions to pin, no game content, and it
# rebuilds only when its own two files change.
#
# Same rules as image-server.yml so both read the same way: every tag v* publishes, a manual
# run builds without publishing.
#
# The verify step is the point of having CI here at all. This image serves the server's live
# game directory, which contains the rcon password in plain text -- so the check starts the
# container against a fake game directory and asserts the secrets come back 403. A config
# edit that widens the allowlist then fails the build instead of quietly publishing a leak.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: cs16-fastdl

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
            PUBLISH=false
          fi
          # Keep the string usable as a docker tag.
          VERSION="$(printf %s "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (publish=${PUBLISH})"

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/fastdl/Dockerfile
          push: ${{ needs.determine-version.outputs.publish == 'true' }}
          load: ${{ needs.determine-version.outputs.publish != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves maps and refuses secrets
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:latest"
          if [[ "${{ needs.determine-version.outputs.publish }}" == "true" ]]; then
            # The build pushed rather than loaded, so check what was actually published.
            IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ needs.determine-version.outputs.version }}"
            docker pull "$IMAGE"
          fi

          # A stand-in for the server's game directory, holding one of everything that matters.
          root="$(mktemp -d)"
          mkdir -p "$root/cstrike/maps" "$root/cstrike/addons/pugmod/cfg"
          echo map    > "$root/cstrike/maps/test.bsp"
          echo nav    > "$root/cstrike/maps/test.nav"
          echo secret > "$root/cstrike/.rcon_password"
          echo secret > "$root/cstrike/cs16-moded.cfg"
          echo cfg    > "$root/cstrike/server.cfg"
          echo admins > "$root/cstrike/addons/pugmod/cfg/adminlist.cfg"
          echo notes  > "$root/cstrike/addons/pugmod/cfg/notes.txt"
          chmod -R a+rX "$root"

          docker run -d --name fastdl-check -p 8080:80 -v "$root:/srv/hlds:ro" "$IMAGE"

          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/cstrike/maps/test.bsp 2>/dev/null && break
            sleep 1
          done

          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$1"; }

          fail=0
          check() {
            got="$(code "$1")"
            if [[ "$got" != "$2" ]]; then
              echo "FAIL: /$1 -> $got, expected $2"
              fail=1
            else
              echo "ok:   /$1 -> $got"
            fi
          }

          check cstrike/maps/test.bsp 200

          # Everything below would be a leak or a waste of bandwidth.
          check cstrike/.rcon_password 403
          check cstrike/cs16-moded.cfg 403
          check cstrike/server.cfg 403
          check cstrike/addons/pugmod/cfg/adminlist.cfg 403
          check cstrike/addons/pugmod/cfg/notes.txt 403
          check cstrike/maps/test.nav 403
          check cstrike/ 403
          check '' 403

          check cstrike/maps/missing.bsp 404

          # The password must not appear in a response body either, not just in a status code.
          if curl -s http://127.0.0.1:8080/cstrike/.rcon_password | grep -q secret; then
            echo "FAIL: .rcon_password contents were served"
            fail=1
          fi

          docker logs fastdl-check 2>&1 | tail -20
          docker rm -f fastdl-check >/dev/null

          # The config drop-in: an empty directory mounted at /opt/fastdl must be SEEDED with
          # the image's template, and the running server must still work. This is the case that
          # was broken once -- mounting a directory over the templates path hid the baked
          # template and nginx rendered nothing, so the mirror answered 404 for everything.
          conf="$(mktemp -d)"
          docker run -d --name fastdl-seed -p 8081:80 \
            -v "$root:/srv/hlds:ro" -v "$conf:/opt/fastdl" "$IMAGE"

          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8081/cstrike/maps/test.bsp 2>/dev/null && break
            sleep 1
          done

          if [[ ! -f "$conf/default.conf.template" ]]; then
            echo "FAIL: an empty /opt/fastdl was not seeded with the template"
            ls -la "$conf"
            fail=1
          else
            echo "ok:   /opt/fastdl seeded with $(ls "$conf" | tr '\n' ' ')"
          fi

          seeded_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/cstrike/maps/test.bsp)"
          if [[ "$seeded_code" != "200" ]]; then
            echo "FAIL: with a seeded config the map returned $seeded_code, expected 200"
            fail=1
          else
            echo "ok:   seeded config serves the map"
          fi

          # Seeding must not take ownership of the operator's directory. The container is root,
          # and `cp -a "$DIST/." "$DIR/"` stamps the source directory's own uid/gid onto the
          # destination -- so a bind-mounted ./fastdl came back root:root and the host could no
          # longer edit, or even delete, the config it had just been handed. That shipped once;
          # this is the check that catches it coming back.
          me="$(id -u)"
          dir_uid="$(stat -c %u "$conf")"
          file_uid="$(stat -c %u "$conf/default.conf.template" 2>/dev/null || echo -)"
          if [[ "$dir_uid" != "$me" || "$file_uid" != "$me" ]]; then
            echo "FAIL: seeding changed ownership (dir uid=$dir_uid, file uid=$file_uid, expected $me)"
            fail=1
          else
            echo "ok:   the seeded config is still owned by uid $me"
          fi

          docker logs fastdl-seed 2>&1 | grep '\[fastdl\]' || true
          docker rm -f fastdl-seed >/dev/null
          # Cleanup last, and never let it set the exit status: if the ownership fix ever
          # regresses these paths are root-owned, and a failing rm would report as the error
          # instead of the assertion above that actually explains why.
          rm -rf "$conf" "$root" 2>/dev/null || sudo rm -rf "$conf" "$root" || true

          exit $fail

      - name: Summary
        run: |
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published:** \`${{ needs.determine-version.outputs.publish }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ needs.determine-version.outputs.version }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "Serves maps over HTTP for \`sv_downloadurl\`; refuses cfgs, \`addons/\`, \`.nav\` and dotfiles." >> $GITHUB_STEP_SUMMARY
