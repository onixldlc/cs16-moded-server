# Modded Counter-Strike 1.6: ReHLDS + ReGameDLL_CS + Metamod-R + PugMod + zBot + Reunion.
#
#   docker compose up -d && docker compose logs -f
#
# The first start downloads ~544 MB from Steam and the server is unreachable until the log says
# "content ready". Every knob, and everything below, is explained in README.md.

services:
  cs16:
    image: ghcr.io/onixldlc/cs16-moded-server:latest
    container_name: cs16-moded-server
    restart: unless-stopped

    # Public port is the left side only.
    ports:
      - "8222:27015/udp"

    environment:
      INSECURE: "1"
      MAP: de_dust2
      MAXPLAYERS: "12"
      SV_LAN: "0"
      #STEAM_ACCOUNT: ""

      # Unset: 32 random chars on first start, printed in the log, kept in the volume.
      #RCON_PASSWORD: ""
      #RCON_ENABLED: "0"

      #ZBOT_NAV: "czero"          # czero | none
      #REUNION: "off"             # non-Steam clients, on by default
      #REUNION_NOSTEAM: "allow"   # allow | valve | reject

      # Console commands, one per line, applied after server.cfg.
      EXTRA_CVARS: |
        mp_consistency 0

      # Engine command line. Replaces the managed equivalent rather than being passed twice.
      #EXTRA_ARGS: "-nomaster -noipx -nojoy -pingboost 3 -heapsize 65536"

      # Inside the volume, so installing the download is a rename and not a 544 MB copy.
      STAGE_DIR: /opt/hlds/.staging

      #FORCE_REFETCH: "1"

    volumes:
      # Your own maps, models, sounds and cfgs: one directory laid out like cstrike/, copied
      # over the game on every start. Create it before uncommenting.
      #- ./content:/opt/overlay:ro

      - hlds-content:/opt/hlds
      - hlds-addons:/opt/hlds/cstrike/addons

    stdin_open: true
    tty: true

  # Optional HTTP download mirror for clients (sv_downloadurl). Serves the content volume
  # read-only through an allowlist, so it never hands out cfgs or the rcon password.
  # Enable: sed -i -E 's/^  #(  |fastdl:)/  \1/' docker-compose.yml && mkdir fastdl
  # Then set sv_allowdownload and sv_downloadurl in EXTRA_CVARS above.
  #fastdl:
  #  image: ghcr.io/onixldlc/cs16-fastdl:latest
  #  container_name: cs16-fastdl
  #  restart: unless-stopped
  #  ports:
  #    - "8225:80"
  #  volumes:
  #    - hlds-content:/srv/hlds:ro
  #    - ./fastdl:/opt/fastdl

volumes:
  hlds-content:
  hlds-addons:
